# nutrii — Local Development Infrastructure
# Minimal setup: PostgreSQL only (for offline dev).
# Production uses Supabase directly.
#
# Usage:
#   docker compose up -d
#   docker compose down -v  # destroys volume (full reset)

services:

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — matches Supabase's PG version
  # ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nutrii_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrii}
      POSTGRES_USER: ${POSTGRES_USER:-nutrii_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrii_dev_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrii_user} -d ${POSTGRES_DB:-nutrii}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
