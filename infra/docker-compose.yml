# nutrii — Local Development Infrastructure
# Mirrors the production Supabase environment as closely as possible.
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose down -v  # destroys volumes (full reset)

services:

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL 16 — matches Supabase's PG version
  # ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nutrii_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrii}
      POSTGRES_USER: ${POSTGRES_USER:-nutrii_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrii_dev_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrii_user} -d ${POSTGRES_DB:-nutrii}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrii_network

  # ─────────────────────────────────────────────────────────────────
  # Redis — caching + rate limiting
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nutrii_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-nutrii_redis_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrii_network

  # ─────────────────────────────────────────────────────────────────
  # MinIO — S3-compatible local storage (mirrors Supabase Storage)
  # Buckets: food-images, molecule-structures, study-attachments
  # ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nutrii_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nutrii_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nutrii_minio_dev_password}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - nutrii_network

  # ─────────────────────────────────────────────────────────────────
  # MeiliSearch — full-text search
  # ─────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: nutrii_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-nutrii_meili_dev_key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - nutrii_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data:

networks:
  nutrii_network:
    driver: bridge
