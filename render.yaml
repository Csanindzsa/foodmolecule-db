# Render.com deployment configuration for nutrii
# Free tier: web service + background worker
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nutrii-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn nutrii.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "nutrii-api.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false  # Set manually, or leave empty to use SUPABASE_URL + SUPABASE_DB_PASSWORD
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nutrii.app,https://www.nutrii.app,http://localhost:5173"
      - key: PYTHON_VERSION
        value: "3.10"
    healthCheckPath: /api/v1/health/
