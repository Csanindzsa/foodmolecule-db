name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ""
      SUPABASE_URL: ""
      SUPABASE_DB_PASSWORD: ""
      DJANGO_SECRET_KEY: test-ci-secret
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q ../ai . ../ocr ../scripts
      - name: Validate food seed schemas
        run: python ../scripts/validate_schema.py food ../data/seed/foods
      - name: Validate molecule seed schemas
        run: python ../scripts/validate_schema.py molecule ../data/seed/molecules
      - name: Check launch seed readiness
        run: python ../scripts/check_seed_readiness.py --min-foods 100 --min-molecules 4
      - name: Dry-run seed ingestion pipeline
        run: python ../scripts/run_pipeline.py --foods ../data/seed/foods --molecules ../data/seed/molecules --dry-run
      - name: Validate ban list schema
        run: python ../scripts/validate_schema.py ban_list ../ban_list/ban_list.json
      - name: Check static web route contract
        run: python ../scripts/check_web_routes.py
      - name: Check static mobile release contract
        run: python ../scripts/check_mobile_release.py
      - name: Run core tests
        run: python -m pytest core/tests -q
      - name: Run AI tests
        working-directory: .
        run: python -m pytest ai/tests -q
      - name: Run OCR tests
        working-directory: .
        run: python -m pytest ocr/tests -q

  web:
    name: Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build web
        run: bun run build
